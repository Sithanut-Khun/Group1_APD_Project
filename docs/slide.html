        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #3a3a3a;
            min-height: 100vh;
            padding: 20px;
        }
        
        #root {
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            overflow: hidden;
            background: white;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            font-size: 28px;
            color: #3498db;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }
        
        .presentation-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }
        
        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .nav-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        
        .nav-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .nav-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .slides-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8fafc;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateX(100%);
            transition: transform 0.6s ease, opacity 0.6s ease;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }
        
        .slide.previous {
            transform: translateX(-100%);
        }
        
        .slide-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        .slide-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .slide-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: #3498db;
            border-radius: 2px;
        }
        
        .slide-subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-align: center;
            color: #7f8c8d;
        }
        
        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: #ecf0f1;
            border-top: 1px solid #d5dbdb;
        }
        
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #bdc3c7;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .progress-dot:hover {
            background: #95a5a6;
            transform: scale(1.2);
        }
        
        .progress-dot.active {
            background: #3498db;
            transform: scale(1.3);
        }
        
        /* Slide-specific styles */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        
        .team-member {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }
        
        .team-member:hover {
            transform: translateY(-5px);
            background: #f8fafc;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
        
        .architecture-diagram {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
        }
        
        .architecture-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 0 20px;
            position: relative;
        }
        
        .step-icon {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
            color: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.15);
            border: 2px solid #e3f2fd;
        }
        
        .step-arrow {
            position: absolute;
            right: -40px;
            top: 20px;
            color: #bdc3c7;
            font-size: 24px;
        }
        
        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 40px;
        }
        
        .tech-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 220px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e8e8e8;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }
        
        .tech-card:hover {
            transform: translateY(-10px);
            border-color: #3498db;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        
        .tech-icon {
            font-size: 40px;
            margin-bottom: 20px;
            color: #3498db;
        }
        
        .model-feature-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 40px;
        }
        
        .feature-item {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #3498db;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }
        
        .feature-title {
            color: #3498db;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .database-section {

            gap: 40px;
            margin-top: 40px;
        }
        
        .db-card {
            flex: 1;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            border-top: 4px solid;
        }
        
        .fastapi-card {
            border-color: #3498db;
        }
        
        .postgres-card {
            border-color: #336791;
        }
        
        .deployment-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }
        
        .deploy-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);

        }
        
        .deploy-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-top: 3px solid #3498db;
        }

            font-size: 2rem;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;

            align-items: center;
            gap: 20px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);

            transform: translateX(10px);
            background: #f8fafc;
        }

            height: 45px;
            background: #3498db;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 1.2rem;

        .thank-you-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .thank-you-box {

            padding: 60px 100px;
            border-radius: 20px;
            background: white;
            margin-bottom: 50px;
            box-shadow: 0 15px 30px rgba(52, 152, 219, 0.15);
        }
        
        .thank-you-text {
            font-size: 4rem;
            color: #3498db;
            font-weight: bold;
        }
        
        .questions-text {
            font-size: 2rem;
            margin-bottom: 40px;
            color: #2c3e50;
        }
        
        .footer-note {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 40px;
        }
        
        .info-box {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border-left: 4px solid #3498db;
        }
        
        .code {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .slide-counter {
            color: #bdc3c7;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .activity-badge {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            color: #3498db;
            font-weight: 500;
        }
        
        /* Responsive adjustments */
        @media (max-width: 992px) {
            .team-grid, .deployment-section {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .activity-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .app-container {
                height: auto;
                min-height: 95vh;
            }
            
            .slide {
                padding: 30px 20px;
            }
            
            .slide-title {
                font-size: 2rem;
            }
            
            .team-grid, .model-feature-list, .deployment-section {
                grid-template-columns: 1fr;
            }
            
            .architecture-diagram {
                flex-direction: column;
                gap: 40px;
            }
            
            .step-arrow {
                right: auto;
                top: auto;
                bottom: -40px;
                transform: rotate(90deg);
            }
            
            .tech-stack {
                flex-direction: column;
                align-items: center;
            }
            
            .database-section {
                flex-direction: column;
            }
            
            .thank-you-box {
                padding: 40px 20px;
                width: 90%;
            }
            
            .thank-you-text {
                font-size: 3rem;
            }
            
            .questions-text {
                font-size: 1.5rem;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            
            .nav-controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .activity-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .slide-title {
                font-size: 1.8rem;
            }
            
            .thank-you-text {
                font-size: 2.5rem;
            }
            
            .step-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .nav-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

        // Main App Component
        function App() {
            const [currentSlide, setCurrentSlide] = useState(0);
            
            const nextSlide = () => {
                if (currentSlide < slidesData.length - 1) {
                    setCurrentSlide(currentSlide + 1);
                }
            };
            
            const prevSlide = () => {
                if (currentSlide > 0) {
                    setCurrentSlide(currentSlide - 1);
                }
            };
            
            const goToSlide = (index) => {
                setCurrentSlide(index);
            };
            
            // Keyboard navigation
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') {
                        nextSlide();
                    } else if (e.key === 'ArrowLeft') {
                        prevSlide();
                    } else if (e.key >= '1' && e.key <= '9') {
                        const slideIndex = parseInt(e.key) - 1;
                        if (slideIndex < slidesData.length) {
                            goToSlide(slideIndex);
                        }
                    }
                };
                
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentSlide]);
            
            const SlideComponent = slidesData[currentSlide].content;
            
            return (
                <div className="app-container">
                    <header className="header">
                        <div className="logo">
                            <div className="logo-icon">
                                <i className="fas fa-brain"></i>
                            </div>
                            <div className="presentation-title">NeuralPose - Human Activity Recognition</div>
                        </div>
                        
                        <div className="nav-controls">
                            <button 
                                className="nav-btn" 
                                onClick={prevSlide}
                                disabled={currentSlide === 0}
                            >
                                <i className="fas fa-arrow-left"></i> Previous
                            </button>
                            
                            <div className="slide-counter">
                                Slide {currentSlide + 1} of {slidesData.length}
                            </div>
                            
                            <button 
                                className="nav-btn" 
                                onClick={nextSlide}
                                disabled={currentSlide === slidesData.length - 1}
                            >
                                Next <i className="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </header>
                    
                    <div className="slides-container">
                        {slidesData.map((slide, index) => {
                            const SlideContent = slide.content;
                            let slideClass = 'slide';
                            
                            if (index === currentSlide) {
                                slideClass += ' active';
                            } else if (index < currentSlide) {
                                slideClass += ' previous';
                            }
                            
                            return (
                                <div key={slide.id} className={slideClass}>
                                    <SlideContent />
                                </div>
                            );
                        })}
                    </div>
                    
                    <div className="progress-indicator">
                        {slidesData.map((_, index) => (
                            <div 
                                key={index}
                                className={`progress-dot ${index === currentSlide ? 'active' : ''}`}
                                onClick={() => goToSlide(index)}
                                title={`Go to slide ${index + 1}`}
                            ></div>
                        ))}
                    </div>
                </div>
            );
        }
        
        // Render the React app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
